<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | NOTES APP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">✍️</div>
            <h2>Create Account</h2>
            <p class="subtitle">Join us to start taking notes</p>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="username" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="login-btn" onclick="signup()">Sign Up</button>
            
            <div id="message" class="message"></div>
            
            <p class="footer-text">
                Already have an account? <a href="index.html">Sign In</a>
            </p>
        </div>
    </div>

    <script src="signup-logic.js"></script>
</body>
</html>
